name: Deploy to GitHub Pages

on:
  push:
    branches: [ master ]
  schedule:
    - cron: '0 3 * * *' # Execução diária automática às 00:00 BRT (03:00 UTC)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  PRIVATE_ACTIVITY_TOKEN: ${{ secrets.PRIVATE_ACTIVITY_TOKEN || secrets.GITHUB_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install, build, and upload with Astro
        uses: withastro/action@v6
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
